<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ttl desc">
<title id="ttl">TechCommerce - AWS Serverless Automation</title>
<desc id="desc">Capa em fundo preto e azul-marinho com destaques laranja e arquitetura de automacao AWS: novo pedido, EventBridge, Lambda, S3 e CloudWatch.</desc>
<defs>
  <radialGradient id="bg" cx=".48" cy=".46" r=".78"><stop stop-color="#18202F"/><stop offset=".55" stop-color="#0A101C"/><stop offset="1" stop-color="#05070B"/></radialGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFCC65"/><stop offset=".40" stop-color="#FF9900"/><stop offset="1" stop-color="#BF4900"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D3040"/><stop offset=".53" stop-color="#0E1726"/><stop offset="1" stop-color="#090C12"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25C5F3"/><stop offset="1" stop-color="#18459A"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45D88E"/><stop offset="1" stop-color="#087A6B"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="19"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
