<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation Algorithm Simulator</title>
  <desc id="desc">Capa escura com elementos em vermelho e azul representando sinais, ranking e recomendação personalizada.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="0.58" stop-color="#090b10"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff4a55"/>
      <stop offset="1" stop-color="#a00010"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#234bff"/>
      <stop offset="1" stop-color="#081b63"/>
    </linearGradient>
    <filter id="glowR" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="315" r="300" fill="#e50914" opacity=".035"/>
  <circle cx="640" cy="315" r="210" fill="#1247ff" opacity=".03"/>

  <g opacity=".45" fill="none" stroke-linecap="round">
    <path d="M100 390C250 240 410 245 555 320" stroke="#ef233c" stroke-width="5"/>
    <path d="M1180 210C1025 205 900 260 760 335" stroke="#1556ff" stroke-width="5"/>
    <path d="M146 180C330 210 400 270 535 330" stroke="#3342ff" stroke-width="3" opacity=".7"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="165" width="175" height="240" rx="24" fill="url(#blue)" transform="rotate(-7 207 285)"/>
    <rect x="985" y="150" width="175" height="240" rx="24" fill="url(#red)" transform="rotate(7 1072 270)"/>
    <rect x="160" y="360" width="155" height="200" rx="22" fill="#1f2845" transform="rotate(5 237 460)"/>
    <rect x="960" y="360" width="155" height="200" rx="22" fill="#35151b" transform="rotate(-5 1037 460)"/>
  </g>

  <g opacity=".95">
    <rect x="145" y="200" width="125" height="18" rx="9" fill="#6e80ff"/>
    <rect x="145" y="238" width="95" height="12" rx="6" fill="#95a2ff" opacity=".7"/>
    <rect x="1015" y="190" width="115" height="18" rx="9" fill="#ff6b74"/>
    <rect x="1015" y="228" width="88" height="12" rx="6" fill="#ff9da4" opacity=".7"/>
  </g>

  <g filter="url(#glowR)">
    <rect x="520" y="180" width="240" height="240" rx="28" fill="url(#red)"/>
  </g>
  <g transform="translate(570 230)" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 22h125"/>
    <path d="M0 62h92" opacity=".92"/>
    <path d="M0 102h60" opacity=".78"/>
    <path d="M95 94l32 32 48-58"/>
  </g>

  <g filter="url(#glowB)">
    <circle cx="640" cy="525" r="8" fill="#3a6cff"/>
    <circle cx="458" cy="327" r="7" fill="#3a6cff"/>
    <circle cx="820" cy="332" r="7" fill="#ef233c"/>
  </g>

  <text x="640" y="600" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Recommendation Algorithm Simulator</text>
  <text x="640" y="646" text-anchor="middle" fill="#a9afbd" font-family="Arial, Helvetica, sans-serif" font-size="24">Sinais comportamentais → perfil inferido → score → ranking personalizado</text>
</svg>
